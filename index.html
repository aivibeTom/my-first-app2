<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>SKY RUNNER</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">MINI SIDE-SCROLLER</p>
          <h1>SKY RUNNER</h1>
        </div>
        <p class="instructions">← → / A D で移動　 · 　Space / ↑ でジャンプ</p>
      </header>

      <section class="game-frame" aria-label="横スクロールアクションゲーム">
        <canvas id="game" width="960" height="540" aria-label="ゲーム画面"></canvas>
        <div class="game-hud" aria-live="polite">
          <span id="coin-count">COINS&nbsp; 0</span>
          <span id="progress">0%</span>
        </div>
        <div id="game-message" class="game-message" hidden>
          <p id="message-title"></p>
          <p id="message-detail"></p>
          <button id="restart" type="button">もう一度あそぶ</button>
        </div>
      </section>

      <nav class="touch-controls" aria-label="タッチ操作">
        <button class="control-button" data-control="left" aria-label="左へ移動">←</button>
        <button class="control-button" data-control="right" aria-label="右へ移動">→</button>
        <button class="control-button jump-button" data-control="jump" aria-label="ジャンプ">JUMP</button>
      </nav>
      <footer>コインを集めながら、ゴールの旗を目指そう！</footer>
    </main>
  </body>
</html>
